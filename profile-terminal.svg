<svg fill="none" viewBox="0 0 850 1150" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Global Styles */
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; }
    .text-prompt { font: bold 13px 'Fira Code', Consolas, Monaco, monospace; fill: #3fb950; }
    .text-path { font: 13px 'Fira Code', Consolas, Monaco, monospace; fill: #8b949e; }
    .text-cmd { font: bold 13px 'Fira Code', Consolas, Monaco, monospace; fill: #c9d1d9; }
    .text-header { font: bold 13px 'Fira Code', Consolas, Monaco, monospace; fill: #d2a8ff; }
    .text-body { font: 12px 'Fira Code', Consolas, Monaco, monospace; fill: #c9d1d9; }
    .text-muted { font: 12px 'Fira Code', Consolas, Monaco, monospace; fill: #8b949e; }
    .text-accent { font: 12px 'Fira Code', Consolas, Monaco, monospace; fill: #f0883e; }
    .ascii { font: 7px 'Fira Code', Consolas, Monaco, monospace; fill: #58a6ff; font-weight: bold; white-space: pre; }
    
    /* Blinking Cursor Animation */
    .cursor {
      fill: #58a6ff;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

